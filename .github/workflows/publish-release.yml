name: AVILON Release Validation

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate AVILON release
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          VERSION="${GITHUB_REF_NAME}"

          if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "PLATFORM=linux" >> "$GITHUB_ENV"
            echo "Linux release: $VERSION"

          elif [[ "$VERSION" =~ ^windows-[0-9]+(\.[0-9]+)*$ ]]; then
            echo "PLATFORM=windows" >> "$GITHUB_ENV"
            echo "Windows release: $VERSION"

          else
            echo "Invalid release tag: $VERSION"
            exit 1
          fi

      - name: Check release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            --json assets \
            --jq '.assets[].name' > assets.txt

          if [[ "$PLATFORM" == "linux" ]]; then
            if ! grep -q '\.pkg\.tar\.zst$' assets.txt; then
              echo "Linux package not found."
              cat assets.txt
              exit 1
            fi

          elif [[ "$PLATFORM" == "windows" ]]; then
            if ! grep -qi '^AvilonSetup\.exe$' assets.txt; then
              echo "Windows installer not found."
              cat assets.txt
              exit 1
            fi
          fi

          echo "Release assets validated:"
          cat assets.txt
